name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-checks:
    name: Python Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio pydantic pydantic-settings structlog fastapi httpx sqlalchemy alembic

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Pytest Suite
        env:
          PYTHONPATH: packages/kernel/src:packages/contracts/python/src:services/experiment_controller/src:apps/api/src
        run: pytest -v

  typescript-checks:
    name: TypeScript Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json'))"

  compose-smoke:
    name: Compose Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose --profile core config
