[alembic]
script_location = infra/postgres/migrations
prepend_sys_path = apps/api/src;packages/kernel/src;packages/contracts/python/src
sqlalchemy.url = postgresql+psycopg://arena:arena_secret@127.0.0.1:5432/agentic_arena

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
