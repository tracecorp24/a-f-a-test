[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-api"
version = "0.1.0"
description = "Agentic Arena Control Plane API"
requires-python = ">=3.12"
dependencies = [
    "arena-kernel",
    "arena-contracts",
    "arena-worker-sdk",
    "arena-evaluation",
    "arena-recommendation",
    "arena-artifact-exporter",
    "arena-gateway",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arena_api"]
