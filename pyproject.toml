[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-arena-workspace"
version = "0.1.0"
description = "Agentic Arena Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "packages/contracts/python",
    "packages/kernel",
    "packages/worker-sdk/python",
    "packages/shared-tool-sdk",
    "services/task_studio",
    "services/experiment_controller",
    "services/model_gateway",
    "services/tool_broker",
    "services/telemetry",
    "services/evaluation",
    "services/recommendation",
    "services/artifact_exporter",
    "apps/api",
    "apps/cli",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "packages", "services", "apps"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "B",     # flake8-bugbear
    "BLE",   # flake8-blind-except
    "C901",  # complex-structure
    "PLR2004", # magic numbers
    "TRY",   # tryceratops
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
]
ignore = [
    "S101",   # assert used in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages", "services", "apps"]
filterwarnings = ["ignore::DeprecationWarning"]
