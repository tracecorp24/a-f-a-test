[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-kernel"
version = "0.1.0"
description = "Agentic Arena Kernel Primitives"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "structlog>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arena_kernel"]
