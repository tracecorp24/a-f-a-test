[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-contracts"
version = "0.1.0"
description = "Agentic Arena Data Contracts and Schemas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arena_contracts"]
