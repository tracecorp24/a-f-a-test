[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-telemetry"
version = "0.1.0"
description = "Agentic Arena Event Processing and Telemetry"
requires-python = ">=3.12"
dependencies = [
    "arena-kernel",
    "arena-contracts",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arena_telemetry"]
