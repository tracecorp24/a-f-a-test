[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arena-gateway"
version = "0.1.0"
description = "Agentic Arena Model Gateway and Policy Enforcement"
requires-python = ">=3.12"
dependencies = [
    "arena-kernel",
    "arena-contracts",
    "fastapi>=0.115.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "tiktoken>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arena_gateway"]
