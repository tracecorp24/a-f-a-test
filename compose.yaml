services:
  postgres:
    image: postgres:17-alpine
    container_name: arena-postgres
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arena}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arena_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agentic_arena}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arena} -d ${POSTGRES_DB:-agentic_arena}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: arena-api
    profiles: ["core"]
    environment:
      ARENA_ENV: development
      ARENA_PORT: 8000
      ARENA_HOST: 0.0.0.0
      ARENA_DESIGN_MODEL: ${ARENA_DESIGN_MODEL:-}
      ARENA_DESIGN_API_KEY: ${ARENA_DESIGN_API_KEY:-}
      ARENA_DESIGN_BASE_URL: ${ARENA_DESIGN_BASE_URL:-https://api.openai.com/v1}
      ARENA_PROVIDER_API_KEY: ${ARENA_PROVIDER_API_KEY:-}
      ARENA_PROVIDER_TRANSPORT: ${ARENA_PROVIDER_TRANSPORT:-openai}
      ARENA_PROVIDER_BASE_URL: ${ARENA_PROVIDER_BASE_URL:-https://api.openai.com/v1}
      ARENA_MODEL_ID: ${ARENA_MODEL_ID:-mock-agent-model}
      ARENA_DESIGN_TRANSPORT: ${ARENA_DESIGN_TRANSPORT:-openai}
      ARENA_STATE_FILE: /app/data/arena_state.json
      DATABASE_URL: postgresql+psycopg://arena:arena_secret@postgres:5432/agentic_arena
      ARENA_MASTER_KEY: ${ARENA_MASTER_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - arena_state:/app/data
    networks:
      - control
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: arena-web
    profiles: ["core"]
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - control
    depends_on:
      - api

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: arena-otel-collector
    profiles: ["core", "observability"]
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    networks:
      - control
      - sandbox

networks:
  control:
    driver: bridge
  sandbox:
    driver: bridge
    internal: true # Worker network has zero internet egress (ADR-004)

volumes:
  postgres_data:
  arena_state:
